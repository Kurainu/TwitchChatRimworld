name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Source/TwitchChat/TwitchChat.csproj -c Release

      # The csproj post-build drops TwitchChat.dll into modfiles/.../1.6/Assemblies,
      # so the mod folder is already complete; just copy it out and add the license.
      - name: Assemble mod folder
        run: |
          cp -r modfiles/TwitchChatRimworld dist
          cp LICENSE dist/LICENSE
          cp NOTICE dist/NOTICE
          test -f dist/1.6/Assemblies/TwitchChat.dll

      - name: Upload mod folder
        uses: actions/upload-artifact@v4
        with:
          name: TwitchChatRimworld
          path: dist

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pkg/TwitchChatRimworld
          cp -r dist/. pkg/TwitchChatRimworld/
          (cd pkg && zip -r ../TwitchChatRimworld.zip TwitchChatRimworld)
          gh release create "${{ github.ref_name }}" TwitchChatRimworld.zip \
            --title "${{ github.ref_name }}" --generate-notes
